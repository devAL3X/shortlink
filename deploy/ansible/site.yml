---
# Деплой shortlink на VDS (Debian 13): docker + compose, nginx c basic auth, ufw.
# Запуск:  ansible-playbook site.yml
- name: shortlink — деплой на VDS
  hosts: vds
  become: true
  gather_facts: true
  vars_files:
    - group_vars/secrets.yml   # gitignored; ansible грузит из group_vars только all и файлы групп

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Reload sshd
      ansible.builtin.service:
        name: ssh
        state: reloaded

  tasks:
    - name: Только Debian на amd64
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'Debian'
          - ansible_facts.architecture == 'x86_64'
        fail_msg: "Плейбук рассчитан на Debian/amd64, найдено {{ ansible_facts.os_family }}/{{ ansible_facts.architecture }}"

    - name: Базовые пакеты
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, git, nginx, ufw]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ключ репозитория Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Репозиторий Docker
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: ["https://download.docker.com/linux/debian"]
        suites: ["{{ ansible_facts.distribution_release }}"]
        components: [stable]
        architectures: [amd64]
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Docker и compose-плагин
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        state: present
        update_cache: true

    - name: Docker запущен
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Код проекта
      ansible.builtin.git:
        repo: "{{ shortlink_repo }}"
        dest: "{{ shortlink_dir }}"
        version: "{{ shortlink_version }}"
        accept_hostkey: true
        force: true

    - name: Переопределение публикации портов (только loopback)
      ansible.builtin.template:
        src: docker-compose.override.yml.j2
        dest: "{{ shortlink_dir }}/docker-compose.override.yml"
        mode: "0644"

    # docker compose up -d идемпотентен сам по себе: без изменений пересборка
    # и пересоздание контейнеров не выполняются, поэтому гоняем всегда
    - name: Сборка и запуск стека
      ansible.builtin.command: docker compose up -d --build
      args:
        chdir: "{{ shortlink_dir }}"
      changed_when: false

    - name: htpasswd для basic auth
      ansible.builtin.copy:
        content: "{{ basic_auth_user }}:{{ basic_auth_hash }}\n"
        dest: /etc/nginx/.htpasswd.shortlink
        owner: root
        group: www-data
        mode: "0640"
      notify: Reload nginx

    - name: Сайт shortlink в nginx
      ansible.builtin.template:
        src: nginx-shortlink.conf.j2
        dest: /etc/nginx/sites-available/shortlink.conf
        mode: "0644"
      notify: Reload nginx

    - name: Дефолтный сайт отключён
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Сайт включён
      ansible.builtin.file:
        src: /etc/nginx/sites-available/shortlink.conf
        dest: /etc/nginx/sites-enabled/shortlink.conf
        state: link
      notify: Reload nginx

    - name: nginx запущен
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    # sshd: только ключи; дропин 00- читается раньше 50-cloud-init и побеждает
    - name: sshd — hardening (дропин)
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin prohibit-password
        mode: "0644"
      notify: Reload sshd

    # ufw: наружу только ssh и http, остальное deny.
    # Порты приложения закрыты надёжнее — привязкой к 127.0.0.1 (см. override),
    # т.к. docker публикует порты в обход ufw
    - name: ufw — разрешить ssh
      community.general.ufw:
        rule: allow
        name: OpenSSH

    - name: ufw — разрешить http
      community.general.ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: ufw — вход по умолчанию запрещён
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: ufw включен
      community.general.ufw:
        state: enabled

    - name: Применить накопленные изменения
      ansible.builtin.meta: flush_handlers

    # Проверки результата
    - name: Приложение слушает на loopback
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8080
        timeout: 300

    - name: Страница UI открыта без пароля — 200
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: 200

    - name: API без пароля — 401
      ansible.builtin.uri:
        url: http://127.0.0.1/api/links
        status_code: 401

    - name: API с паролем — 200
      ansible.builtin.uri:
        url: http://127.0.0.1/api/links
        url_username: "{{ basic_auth_user }}"
        url_password: "{{ basic_auth_password }}"
        status_code: 200
