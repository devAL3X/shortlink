name: shortlink

# Сегментация сетей (этап 4 «Безопасность ВС»):
#   edge — внешний контур: только frontend, единственный опубликованный порт 8080;
#   app  — прикладной контур: frontend <-> api, worker (api не опубликован наружу);
#   data — контур данных (internal, без доступа в интернет):
#          api/worker <-> postgres(-primary/-replica), redis, rabbitmq1-3.
# Правила: ходить между контурами можно только по перечисленным связям
# (см. матрицу в README и demo/netcheck.sh).

services:
  frontend:
    build:
      context: .
      args:
        SERVICE: frontend
    container_name: shortlink-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks: [edge, app]
    depends_on: [api]

  api:
    build:
      context: .
      args:
        SERVICE: api
    container_name: shortlink-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://shortlink:shortlink@postgres-primary:5432/shortlink}
      REDIS_ADDR: redis:6379
      RABBIT_ADDRS: rabbitmq1:5672,rabbitmq2:5672,rabbitmq3:5672
      RABBIT_USER: app
      RABBIT_PASS: app
    networks: [app, data]
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build:
      context: .
      args:
        SERVICE: worker
    container_name: shortlink-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://shortlink:shortlink@postgres-primary:5432/shortlink}
      RABBIT_ADDRS: rabbitmq1:5672,rabbitmq2:5672,rabbitmq3:5672
      RABBIT_USER: app
      RABBIT_PASS: app
    networks: [app, data]
    depends_on:
      postgres-primary:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy

  postgres-primary:
    image: postgres:17-alpine
    container_name: shortlink-postgres-primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: shortlink
      POSTGRES_PASSWORD: shortlink
      POSTGRES_DB: shortlink
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/hba_primary.conf
      - -c
      - listen_addresses=*
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    volumes:
      - pg_primary:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - ./deploy/pg/hba_primary.conf:/etc/postgresql/hba_primary.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortlink -d shortlink"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [data]

  postgres-replica:
    image: postgres:17-alpine
    container_name: shortlink-postgres-replica
    restart: unless-stopped
    entrypoint: ["sh", "/usr/local/bin/replica-entrypoint.sh"]
    environment:
      PRIMARY_HOST: postgres-primary
      REPL_USER: replicator
      REPL_PASSWORD: replpass
      PGSLOT: replica_1
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pg_replica:/var/lib/postgresql/data
      - ./deploy/pg/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    networks: [data]
    depends_on:
      postgres-primary:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: shortlink-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [data]

  rabbitmq1:
    image: rabbitmq:4.1-management-alpine
    container_name: shortlink-rabbitmq1
    hostname: rabbitmq1
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
      RABBITMQ_ERLANG_COOKIE: shortlink-cookie
    volumes:
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "15672:15672" # management UI для демонстрации состояния кластера
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [data, mgmt]

  rabbitmq2:
    image: rabbitmq:4.1-management-alpine
    container_name: shortlink-rabbitmq2
    hostname: rabbitmq2
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
      RABBITMQ_ERLANG_COOKIE: shortlink-cookie
    volumes:
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks: [data]

  rabbitmq3:
    image: rabbitmq:4.1-management-alpine
    container_name: shortlink-rabbitmq3
    hostname: rabbitmq3
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
      RABBITMQ_ERLANG_COOKIE: shortlink-cookie
    volumes:
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks: [data]

networks:
  edge:
    name: shortlink_edge
  app:
    name: shortlink_app
  data:
    name: shortlink_data
    internal: true
  mgmt:
    name: shortlink_mgmt # отдельный сегмент оператора: только management UI rabbitmq1

volumes:
  pg_primary:
    name: shortlink_pg_primary
  pg_replica:
    name: shortlink_pg_replica
